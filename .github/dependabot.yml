version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend dependencies are managed by `uv` (uv.lock); dependabot has no uv
  # ecosystem. `uv lock --upgrade` is the manual refresh path (see README).
